# Brings upstream releases into this fork. FORK.md explains the process.
name: Fork sync

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to merge. Leave empty for the newest release.
        required: false
        default: ''

concurrency:
  group: fork-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: open-pencil/open-pencil
  BASE_BRANCH: patched
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for the sync token
        env:
          TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The repository secret FORK_SYNC_TOKEN is missing. FORK.md says how to make it."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          lfs: false

      - name: Fetch upstream
        run: |
          git config user.name 'fork-sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --quiet upstream main
          git fetch --quiet --force upstream 'refs/tags/*:refs/tags/*'

      - name: Mirror upstream main
        # No --force. If our main has diverged from upstream, someone committed to it by mistake,
        # and the job stops so a person can look.
        run: git push origin refs/remotes/upstream/main:refs/heads/main

      - name: Choose the upstream release
        id: release
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          TRACK_PRERELEASES: ${{ vars.TRACK_PRERELEASES || 'true' }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            filter='[.[] | select(.isDraft | not)'
            if [ "$TRACK_PRERELEASES" != 'true' ]; then filter="$filter | select(.isPrerelease | not)"; fi
            filter="$filter] | sort_by(.publishedAt) | last | .tagName"
            tag=$(gh release list -R "$UPSTREAM" --limit 30 --json tagName,isDraft,isPrerelease,publishedAt --jq "$filter")
          fi
          if [ -z "$tag" ] || [ "$tag" = 'null' ]; then echo "::error::No upstream release found."; exit 1; fi
          git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null || { echo "::error::Upstream has no tag $tag."; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "refs/tags/$tag" HEAD; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "$BASE_BRANCH already contains $tag."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "$BASE_BRANCH does not contain $tag yet."
          fi

      - name: Merge the release into a sync branch
        id: merge
        if: steps.release.outputs.current == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          branch="sync/$TAG"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch --quiet -c "$branch"
          if git merge --no-ff --no-edit -m "chore(fork): merge upstream $TAG" "refs/tags/$TAG"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            git push --force origin "$branch"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
          fi

      - name: Open the sync pull request
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $BRANCH is already open. The push above updated it."
            exit 0
          fi
          carried=$(git log --no-merges --format='- %h %s' "refs/tags/$TAG..HEAD")
          {
            echo "Brings upstream [$TAG](https://github.com/$UPSTREAM/releases/tag/$TAG) into \`$BASE_BRANCH\`."
            echo
            echo "**Merge with a merge commit.** A squash merge drops the upstream history."
            echo
            echo "Carried changes still on top of upstream:"
            echo
            echo "${carried:-None.}"
            echo
            echo "Before you merge, check that \`fork-check\` passed and that the carried changes in FORK.md still apply."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "Sync upstream $TAG" --body-file "$RUNNER_TEMP/body.md"

      - name: Report a merge conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          title="Upstream $TAG conflicts with $BASE_BRANCH"
          if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "An issue for this conflict is already open."
          else
            {
              echo "The sync job could not merge upstream [$TAG](https://github.com/$UPSTREAM/releases/tag/$TAG) into \`$BASE_BRANCH\`."
              echo
              echo "Files with conflicts:"
              echo
              # shellcheck disable=SC2016 # The backticks are Markdown, not shell.
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
              echo
              echo "To fix it:"
              echo
              echo '```sh'
              echo "git fetch upstream --tags && git switch -c sync/$TAG origin/$BASE_BRANCH"
              echo "git merge --no-ff $TAG   # resolve, commit, push, then open a pull request to $BASE_BRANCH"
              echo '```'
            } > "$RUNNER_TEMP/issue.md"
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
          echo "::error::Upstream $TAG conflicts with $BASE_BRANCH."
          exit 1

      - name: Turn off upstream workflows
        # Upstream workflows need upstream secrets and runners, and they would use this fork's
        # Actions minutes. Each sync can bring new ones, so the job checks every time.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          gh workflow list --all --json id,path,state \
            --jq '.[] | select(.state == "active") | select(.path | test("^\\.github/workflows/fork-") | not) | "\(.id) \(.path)"' |
            while read -r id path; do
              echo "Turning off $path"
              gh workflow disable "$id"
            done
